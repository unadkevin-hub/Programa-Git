<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Kevin Andrés Oliveros Canchila">
  <meta name="description" content="Sistema de gestión de ventas e inventario - Mini Market Bamer">
  <title>Registrar venta | Mini Market Bamer</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/componentes.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-roles="admin vendedor" data-pagina="venta">
<div class="app">
  <aside class="menu" id="menu" aria-label="Menú principal"></aside>
  <div class="menu-fondo" id="menuFondo"></div>

  <div class="contenido">
    <header class="barra">
      <button class="btn-menu" id="btnMenu" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"></button>
      <h1 id="tituloPagina">Registrar venta</h1>
      <div class="usuario" id="usuario"></div>
    </header>

    <main id="principal">
      <div class="venta">
        <section class="panel" aria-labelledby="tituloProductos">
          <div class="seccion-cab"><h2 id="tituloProductos">Productos</h2></div>
          <div class="herramientas">
            <div class="buscador">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <label for="buscar" class="solo-lector">Buscar producto</label>
              <input class="input" type="search" id="buscar" placeholder="Buscar por nombre o código de barras" autocomplete="off">
            </div>
            <label for="filtroCategoria" class="solo-lector">Categoría</label>
            <select class="input" id="filtroCategoria"><option value="">Todas las categorías</option></select>
          </div>
          <ul class="lista-productos" id="listaProductos" aria-live="polite"></ul>
        </section>

        <section class="panel carrito" aria-labelledby="tituloCarrito">
          <div class="seccion-cab">
            <h2 id="tituloCarrito">Venta actual</h2>
            <span class="texto-suave" id="numeroVenta"></span>
          </div>
          <ul class="carrito-lista" id="carritoLista"></ul>
          <div class="carrito-total">
            <span>Total</span>
            <output id="total" for="carritoLista">$ 0</output>
          </div>
          <div class="pago">
            <div class="campo">
              <label for="recibido">Recibido</label>
              <input class="input" type="number" id="recibido" min="0" step="100" inputmode="numeric" placeholder="0">
              <span class="msg-error"></span>
            </div>
            <div class="campo">
              <span class="etiqueta">Cambio</span>
              <output id="cambio" for="recibido">$ 0</output>
            </div>
          </div>
          <div class="pila" style="gap:8px">
            <button class="btn btn-primario btn-bloque" type="button" id="btnCobrar" disabled>Cobrar venta</button>
            <button class="btn btn-bloque" type="button" id="btnVaciar" disabled>Vaciar venta</button>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/validaciones.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/venta.js"></script>
</body>
</html>
