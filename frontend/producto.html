<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Kevin Andrés Oliveros Canchila">
  <meta name="description" content="Sistema de gestión de ventas e inventario - Mini Market Bamer">
  <title>Nuevo producto | Mini Market Bamer</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/componentes.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-roles="admin" data-pagina="producto">
<div class="app">
  <aside class="menu" id="menu" aria-label="Menú principal"></aside>
  <div class="menu-fondo" id="menuFondo"></div>

  <div class="contenido">
    <header class="barra">
      <button class="btn-menu" id="btnMenu" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"></button>
      <h1 id="tituloPagina">Nuevo producto</h1>
      <div class="usuario" id="usuario"></div>
    </header>

    <main id="principal">
      <form id="formProducto" novalidate style="max-width:820px">
        <fieldset>
          <legend>Datos del producto</legend>
          <div class="form-grid">
            <div class="campo">
              <label for="codigo">Código de barras *</label>
              <input class="input" type="text" id="codigo" placeholder="Escanea o escribe el código" inputmode="numeric" maxlength="14">
              <span class="msg-error"></span>
            </div>
            <div class="campo">
              <label for="nombre">Nombre del producto *</label>
              <input class="input" type="text" id="nombre" placeholder="Ej: Arroz Diana 500 g" maxlength="60">
              <span class="msg-error"></span>
            </div>
            <div class="campo">
              <label for="categoria">Categoría *</label>
              <input class="input" type="text" id="categoria" list="listaCategorias" placeholder="Escoge o escribe una nueva">
              <datalist id="listaCategorias"></datalist>
              <span class="msg-error"></span>
            </div>
            <div class="campo ancho-completo">
              <label for="descripcion">Descripción</label>
              <textarea class="input" id="descripcion" maxlength="200" placeholder="Opcional: presentación, proveedor, observaciones"></textarea>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Precios y existencias</legend>
          <div class="form-grid">
            <div class="campo">
              <label for="compra">Precio de compra *</label>
              <input class="input" type="number" id="compra" min="0" step="50" inputmode="numeric">
              <span class="msg-error"></span>
            </div>
            <div class="campo">
              <label for="venta">Precio de venta *</label>
              <input class="input" type="number" id="venta" min="0" step="50" inputmode="numeric">
              <span class="msg-error"></span>
              <span class="ayuda" id="margen"></span>
            </div>
            <div class="campo">
              <label for="stock">Stock actual *</label>
              <input class="input" type="number" id="stock" min="0" step="1" inputmode="numeric">
              <span class="msg-error"></span>
            </div>
            <div class="campo">
              <label for="minimo">Stock mínimo *</label>
              <input class="input" type="number" id="minimo" min="0" step="1" inputmode="numeric">
              <span class="msg-error"></span>
              <span class="ayuda">Con esta cantidad o menos el producto sale en “Por agotarse”.</span>
            </div>
          </div>
        </fieldset>

        <div class="acciones">
          <a class="btn" href="inventario.html">Cancelar</a>
          <button class="btn btn-primario" type="submit" id="btnGuardar">Guardar producto</button>
        </div>
      </form>
    </main>
  </div>
</div>

<script src="assets/js/validaciones.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/inventario.js"></script>
</body>
</html>
